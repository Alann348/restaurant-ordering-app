<html>
    <head>
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
       <link rel="stylesheet" href="index.css">
    </head>

    <body>
    <header class="hero">
        <div class="hero-content">
            <h1> Jimmy`s Diner</h1>
            <p>The best burgers and pizza in town!</p>
        </div>
    </header>

    <div id="menu"></div>
    <div id="order"></div>

    <div class="modal" id="payment-modal">
        <form class="modal-content" id="payment-form">
            <h2 class="modal-title">Enter card details</h2>
            <input type="text" id="name" placeholder="Enter your name" required>
            <input type="text" id="card-number" placeholder="Enter card number" required>
            <input type="text" id="cvv" placeholder="Enter CVV" required>
            <button type="submit" class="pay-btn">Pay</button>
        </form>
    </div>
	<script type="module" src="index.js"></script>
    </body>

</html>
